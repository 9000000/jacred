---
# Dependabot version updates for all dependency ecosystems in this repository.
#
# Covered manifests:
#   - JacRed.csproj, tests/JacRed.Tests/JacRed.Tests.csproj  (nuget)
#   - web/package.json, web/package-lock.json                 (npm)
#   - Dockerfile (Alpine + .NET SDK ARG defaults)             (docker)
#   - .github/workflows/*.yml                                 (github-actions)
#
# docker-compose.example.yml is intentionally excluded: it uses non-standard
# naming and mostly :latest tags, which Dependabot cannot meaningfully bump.
version: 2
updates:
  # ── .NET / NuGet ──────────────────────────────────────────────────────────
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "dotnet"
    groups:
      dotnet-minor-patch:
        update-types:
          - "minor"
          - "patch"
      dotnet-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "deps(dotnet)"

  # ── Web UI (Vue / Vite / TypeScript) ──────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "web"
    # Stay on TypeScript 6 until the toolchain (typescript-eslint, vue-tsc, …) supports 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-patch:
        update-types:
          - "minor"
          - "patch"
      web-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "deps(web)"

  # ── Docker base images (Dockerfile ARG defaults) ──────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "deps(docker)"

  # ── GitHub Actions (workflows + reusable workflows) ───────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
