# JacRed HTTP job schedule (replaces Data/crontab)
# schedule: standard 5-field cron (minute hour day month dow)
# path: relative to base_url
# max_time: curl --max-time seconds (HTTP request deadline for run-job.sh)
# enabled: false  # optional — skip this job
#
# Defaults when max_time omitted (by path suffix):
#   ParseAllTask / UpdateTasksParse / jsondb/save → 60 (ack jobs; crawl limit is in-app)
#   else → 900 (15m)
#
# Note: curl max_time is NOT the crawl duration. Long jobs start in the background
# and return ok immediately; in-app walls are 6h (ParseAll) / 30m (UpdateTasks).
# Scheduler: host crontab + run-job.sh (see cron/README.md).
#
# Balanced defaults: frequent staggered parse for freshness; UpdateTasksParse daily;
# ParseAllTask daily ×2 (start + same-day continue after 6h wall). Rutracker is the
# largest map — twice daily is enough (not hourly). Toloka includes full task pipeline.
# Do not schedule ParseLatest / Lostfilm season backfill here.

base_url: http://127.0.0.1:9117

jobs:
  # JSON DB
  - name: jsondb-save
    schedule: "*/5 * * * *"
    path: /jsondb/save
    max_time: 60

  # --- Freshness (parse) — staggered minutes ---

  # Rutor
  - name: rutor-parse
    schedule: "1,16,31,46 * * * *"
    path: /cron/rutor/parse
    max_time: 900
  - name: rutor-UpdateTasksParse
    schedule: "5 2 * * *"
    path: /cron/rutor/UpdateTasksParse
    max_time: 60
  # Deep crawl: 04:30 start + 16:30 continue (pages with updateTime != today)
  - name: rutor-ParseAllTask
    schedule: "30 4,16 * * *"
    path: /cron/rutor/ParseAllTask
    max_time: 60

  # Rutracker (hourly QuickParse; daily Update; ParseAll 2×/day — large map, 6h wall)
  - name: rutracker-parse
    schedule: "0 * * * *"
    path: /cron/rutracker/parse
    max_time: 900
  - name: rutracker-UpdateTasksParse
    schedule: "20 3 * * *"
    path: /cron/rutracker/UpdateTasksParse
    max_time: 60
  # 04:40 start + 11:40 continue (~6h apart matches in-app wall)
  - name: rutracker-ParseAllTask
    schedule: "40 4,11 * * *"
    path: /cron/rutracker/ParseAllTask
    max_time: 60

  # Kinozal
  - name: kinozal-parse
    schedule: "3,18,33,48 * * * *"
    path: /cron/kinozal/parse
    max_time: 900
  - name: kinozal-UpdateTasksParse
    schedule: "10 2 * * *"
    path: /cron/kinozal/UpdateTasksParse
    max_time: 60
  - name: kinozal-ParseAllTask
    schedule: "35 4,16 * * *"
    path: /cron/kinozal/ParseAllTask
    max_time: 60

  # Nnmclub
  - name: nnmclub-parse
    schedule: "5,20,35,50 * * * *"
    path: /cron/nnmclub/parse
    max_time: 900
  - name: nnmclub-UpdateTasksParse
    schedule: "15 2 * * *"
    path: /cron/nnmclub/UpdateTasksParse
    max_time: 60
  - name: nnmclub-ParseAllTask
    schedule: "42 4,16 * * *"
    path: /cron/nnmclub/ParseAllTask
    max_time: 60

  # Selezen (parse only)
  - name: selezen-parse
    schedule: "9,24,39,54 * * * *"
    path: /cron/selezen/parse
    max_time: 900

  # Megapeer
  - name: megapeer-parse
    schedule: "8 * * * *"
    path: /cron/megapeer/parse
    max_time: 900
  - name: megapeer-UpdateTasksParse
    schedule: "20 2 * * *"
    path: /cron/megapeer/UpdateTasksParse
    max_time: 60
  - name: megapeer-ParseAllTask
    schedule: "45 4,16 * * *"
    path: /cron/megapeer/ParseAllTask
    max_time: 60

  # Torrentby
  - name: torrentby-parse
    schedule: "7,22,37,52 * * * *"
    path: /cron/torrentby/parse
    max_time: 900
  - name: torrentby-UpdateTasksParse
    schedule: "25 2 * * *"
    path: /cron/torrentby/UpdateTasksParse
    max_time: 60
  - name: torrentby-ParseAllTask
    schedule: "50 4,16 * * *"
    path: /cron/torrentby/ParseAllTask
    max_time: 60

  # Toloka (full task pipeline)
  - name: toloka-parse
    schedule: "14,54 * * * *"
    path: /cron/toloka/parse
    max_time: 900
  - name: toloka-UpdateTasksParse
