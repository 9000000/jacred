    max_time: 900

  # Bitru
  - name: bitru-parse
    schedule: "10,30,50 * * * *"
    path: /cron/bitru/parse
    max_time: 900

  # Knaben
  - name: knaben-parse
    schedule: "12,32,52 * * * *"
    path: /cron/knaben/parse
    max_time: 900

  # Animelayer
  - name: animelayer-parse
